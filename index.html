<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validación de Credencial</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:linear-gradient(135deg,#f5f5f5,#e9eef5);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    width:90%;
    max-width:500px;
}

.logo{
    width:180px;
    margin-bottom:20px;
}

#estado{
    font-size:42px;
    font-weight:bold;
}

#nombre{
    margin-top:20px;
    font-size:28px;
}

#mensaje{
    margin-top:15px;
    font-size:24px;
}

#fecha{
    color:#666;
    font-size:14px;
    margin-top:20px;
}

.footer{
    color:#777;
    font-size:13px;
}

.activo{
    color:#0a8f08;
}

.inactivo{
    color:#d40000;
}
</style>
</head>

<body>

<div class="card">

<img
src="C:\Users\Sthifen\Downloads\ima.gif"
alt="Visión Social"
class="logo">

<h1 id="estado">Consultando...</h1>

<h2 id="nombre"></h2>

<h3 id="mensaje"></h3>

<p id="fecha"></p>

<hr>

<p class="footer">
Asociación Visión Social
</p>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

fetch("empleados.json")
.then(response => response.json())
.then(data => {

const empleado = data.find(
e => e.token === token
);

if(!empleado){

document.getElementById("estado").innerHTML =
"NO ENCONTRADO";

document.getElementById("mensaje").innerHTML =
"Token inválido";

return;

}

document.getElementById("nombre").innerHTML =
empleado.nombre;

document.getElementById("estado").innerHTML =
empleado.estado;

document.getElementById("fecha").innerHTML =
"Validado el " +
new Date().toLocaleString("es-CO");

if(
empleado.estado.toUpperCase() === "ACTIVO"
){

document.getElementById("estado")
.className="activo";

document.getElementById("mensaje")
.innerHTML="Credencial Válida";

}else{

document.getElementById("estado")
.className="inactivo";

document.getElementById("mensaje")
.innerHTML="Credencial No Válida";

}

});

</script>

</body>
</html>
